version: "3.8"

# ============================================================
# AISS UTS - Portal Akademik DiD + Zero Trust Stack
# Layer Application/IAM : nginx (reverse proxy + WAF) + Keycloak (SSO+MFA)
# Layer Data            : mysql (DVWA) + postgres (Keycloak) - encrypted volumes recommended
# Layer Host & Network  : fail2ban jalan sebagai CONTAINER menempel di network nginx (lihat service fail2ban)
#                         - didesain supaya tetap efektif walau defender jalan murni di Windows (tanpa WSL2)
# ============================================================

services:

  # ---------- REVERSE PROXY + WAF (Layer Application) ----------
  nginx:
    image: owasp/modsecurity-crs:nginx
    container_name: portal-nginx-waf
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/portal.conf:/etc/nginx/templates/conf.d/portal.conf.template:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx   # dibaca oleh service fail2ban di bawah
    environment:
      - BACKEND=http://portal-app:80
      - PARANOIA=1
      - ANOMALY_INBOUND=5
      - ANOMALY_OUTBOUND=4
      - BLOCKING_PARANOIA=1
    depends_on:
      - portal-app
      - keycloak
    networks:
      - frontnet

  # ---------- HOST & NETWORK DEFENSE (Layer Host & Network) ----------
  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: portal-fail2ban
    network_mode: "service:nginx"   # berbagi network namespace dgn nginx -> iptables-nya langsung di jalur traffic nginx
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TZ=Asia/Jakarta
      - F2B_LOG_TARGET=STDOUT
      - F2B_DB_PURGE_AGE=7d
    volumes:
      - ./fail2ban/jail.local:/data/jail.d/jail.local:ro
      - ./fail2ban/filter.d-portal-login.conf:/data/filter.d/portal-login.conf:ro
      - nginx_logs:/var/log/nginx:ro
      - fail2ban_data:/data
    depends_on:
      - nginx
    restart: unless-stopped

  # ---------- IAM / SSO (Layer Application/IAM) ----------
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: portal-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ChangeMe123!
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ChangeMeToo123!
    depends_on:
      - keycloak-db
    networks:
      - frontnet
      - backnet
    # exposed only through nginx in production; port below is for setup only
    ports:
      - "127.0.0.1:8080:8080"

  keycloak-db:
    image: postgres:16
    container_name: portal-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ChangeMeToo123!
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - backnet

  # ---------- TARGET APP: Portal Akademik (aplikasi custom sesuai studi kasus) ----------
  portal-app:
    build: ./portal-app
    container_name: portal-app
    environment:
      - DB_HOST=portal-db
      - DB_NAME=portal_akademik
      - DB_USER=portal
      - DB_PASS=ChangeMePortal123!
      - SECURITY_LEVEL=high   # ganti ke "high" setelah hardening untuk demo "after"
    depends_on:
      - portal-db
    networks:
      - frontnet
      - backnet
    # Jangan expose port ini langsung ke luar - akses HARUS lewat nginx (443)

  portal-db:
    image: mysql:8.0
    container_name: portal-db
    environment:
      MYSQL_ROOT_PASSWORD: ChangeMeRoot123!
      MYSQL_DATABASE: portal_akademik
      MYSQL_USER: portal
      MYSQL_PASSWORD: ChangeMePortal123!
    volumes:
      - portal_db_data:/var/lib/mysql
      - ./portal-app/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backnet

networks:
  frontnet:
    driver: bridge
  backnet:
    driver: bridge
    internal: true   # backend/db tidak bisa diakses langsung dari luar - contoh network segmentation Zero Trust

volumes:
  keycloak_db_data:
  portal_db_data:
  nginx_logs:
  fail2ban_data:
