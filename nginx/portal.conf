# --- Cloudflare Tunnel: percaya header CF-Connecting-IP hanya dari IP range Cloudflare resmi ---
# Daftar lengkap: https://www.cloudflare.com/ips/ (update berkala)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 172.16.0.0/12;
real_ip_header CF-Connecting-IP;

log_format cf_real '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent';

# Redirect semua HTTP ke HTTPS (Data in Transit - enforce TLS)
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name portal-akademik.local portal-akademik.example.com;  # ganti dengan domain Cloudflare kamu
    access_log /var/log/nginx/portal-access.log cf_real;

    ssl_certificate     /etc/nginx/certs/portal.crt;
    ssl_certificate_key /etc/nginx/certs/portal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ModSecurity WAF sudah aktif otomatis lewat base image owasp/modsecurity-crs

    location /admin/ {
        # Contoh: rute admin panel dipisah, ke depannya bisa diwajibkan lewat Keycloak (Zero Trust PEP)
        proxy_pass $BACKEND;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass $BACKEND;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
